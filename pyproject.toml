[project]
name = "quant-rl-thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "backtesting==0.3.3",
    "backtrader>=1.9.78.123",
    "bokeh==3.8.0",
    "build==1.3.0",
    "colorama==0.4.6",
    "contourpy==1.3.3",
    "cython==3.1.4",
    "jinja2==3.1.6",
    "llvmlite==0.44.0",
    "loguru==0.7.3",
    "markupsafe==3.0.2",
    "matplotlib>=3.10.6",
    "metatrader5==5.0.5260; sys_platform == 'win32'",
    "narwhals==2.5.0",
    "numba==0.61.2",
    "numpy==2.2.6",
    "packaging==25.0",
    "pandas==2.3.2",
    "pandas-ta==0.4.71b0",
    "pillow==11.3.0",
    "plotly==5.18.0",
    "pyproject-hooks==1.2.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.1",
    "pytz==2025.2",
    "pyyaml==6.0.3",
    "six==1.17.0",
    "ta-lib==0.6.7",
    "tenacity==9.1.2",
    "tornado==6.5.2",
    "tqdm==4.67.1",
    "tzdata==2025.2",
    "win32-setctime==1.2.0; sys_platform == 'win32'",
    "xyzservices==2025.4.0",
    "yfinance>=0.2.66",
    # quant-rl additions
    "torch>=2.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "pyarrow>=15.0",
    "omegaconf>=2.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "mplfinance>=0.12",
    "pandas-stubs>=2.2.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "ruff>=0.7",
]

# Torch source: CPU by default so `uv sync` / uv.lock stay small and match CI
# (CI installs from the CPU lock). To use GPU/CUDA torch locally, swap the
# active line in [tool.uv.sources] (comment/uncomment) and run `uv sync`.
# NOTE: the RTX PRO 500 (Blackwell, sm_120) requires CUDA >= 12.8 kernels, and
# torch 2.13.0 is only published for cp312 linux on the cu130 index (cu128
# stops at 2.11.0), hence cu130.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# torch = { index = "pytorch-gpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# GPU index (Blackwell-capable CUDA 13.0 build; activate via [tool.uv.sources]).
[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: torch/SB3 training tests (minutes on CPU); deselect with -m 'not slow'",
    "unit: fast unit tests",
    "integration: integration tests that touch data pipeline or external I/O",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["quant_rl"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["quant_rl"]

[tool.mypy]
python_version = "3.12"
files = [
    "quant_rl",
    "mt5_trading",
    "scripts",
    "tests",
    "backtest",
    "demo_trading.py",
    "live_trading.py",
]
strict = true
show_error_codes = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
pretty = true
# scripts/, tests/ and backtest/ have no __init__.py; resolve module names
# against the repo root so files aren't seen under two different modules.
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "stable_baselines3", "stable_baselines3.*", "plotly", "plotly.*", "backtrader", "backtrader.*",
    "MetaTrader5", "MetaTrader5.*", "loguru", "loguru.*", "mplfinance", "mplfinance.*", "scipy", "scipy.*",
    "wandb", "yaml", "yfinance", "yfinance.*",
]
ignore_missing_imports = true

# --- Scoped relaxations (keep strict everywhere else) -----------------------
# Tests: don't require full annotations on every helper/fixture.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Plotting glue: matplotlib ships untyped helpers (AutoDateLocator, DateFormatter,
# ...) in the pinned version; calling them is intentional.
[[tool.mypy.overrides]]
module = ["quant_rl.eval.plots", "quant_rl.eval.plots_interactive", "quant_rl.eval.replot_orders", "tests.test_plots_export", "tests.test_training_plots", "tests.test_eval.*"]
disallow_untyped_calls = false

# Legacy scaffold kept for reference (superseded by quant_rl + live_trading_rl):
# resolved via sys.path hacks and untyped; check loosely, not not at all.
[[tool.mypy.overrides]]
module = ["backtest.*", "strategies.*", "utils.*", "demo_trading", "live_trading"]
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Cross-validation backtrader strategies: backtrader types are not well-annotated
[[tool.mypy.overrides]]
module = "quant_rl.backtest.cross_validation.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_subclassing_any = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant_rl"]

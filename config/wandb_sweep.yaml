# W&B hyperparameter sweep for the conditional SAC agent (Gate G3).
# Run with: wandb sweep config/wandb_sweep.yaml && wandb agent <sweep-id>
method: bayes
metric:
  name: sharpe
  goal: maximize
parameters:
  algo:
    value: sac
  arch:
    values: [gru, transformer]
  use_vae:
    # NOTE: quant_rl/train/train_rl.py raises NotImplementedError for
    # --use-vae until the VAE pipeline exists (Master Roadmap Stage 6).
    # Keep this at 0 until then; set to 1 once VAE lands.
    value: 0
  lr:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3
  entropy_coef:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0e-2
  batch_size:
    values: [64, 128, 256]
  steps:
    value: 200000
command:
  - python
  - -m
  - quant_rl.train.train_rl
  - --algo
  - ${parameters.algo}
  - --arch
  - ${parameters.arch}
  - --reward
  - dsr
  - --wandb
  - --seed
  - 42
  # Config-override dotlists — note `learning_rate`, not the swept `lr`
  # alias; the typo-safety guard in quant_rl.config.load_config will raise
  # on anything else instead of silently training at the default LR.
  - ${parameters.algo}.learning_rate=${parameters.lr}
  - ${parameters.algo}.ent_coef=${parameters.entropy_coef}
  - ${parameters.algo}.batch_size=${parameters.batch_size}
  - ppo.total_timesteps=${parameters.steps}

# Idea 1 — PO3 + Manipulation + IFVG strategy (Agent.md §10, §17).
# Merged over default.yaml; flips the feature flag and strategy semantics.
features:
  include_strategy_state: true
  po3_reference_mode: "htf_confirmed"
  po3_reference_timeframes: ["M5", "M15", "H1"]
  po3_phase_mode: "reclaim_then_ifvg"
  ifvg_mtf: {enabled: true, timeframes: ["M5", "M15", "H1"]}
  include_pd_context: true
  structure: {enabled: true, timeframes: ["M5", "M15", "H1"]}

env:
  strategy_actions: true   # trader Box[-1,1]^4 (affine-mapped at decode; PPO mean~0)
  reward_mode: pnl
  sl_buffer_pts: 1.0           # effective stop buffer; matches strategy.risk.sl_buffer_pts

strategy:
  name: "po3_ifvg"
  variant_id: "po3_confirmed_ifvg_htf_mtf_v1"
  session:
    timezone: "Etc/GMT-3"
  liquidity:
    swing_period: 5
    require_reclaim: true
    max_age_bars: 120
  po3:
    require_manipulation_sweep: true
    require_distribution_confirmation: true
  ifvg:
    enabled: true
    max_age_bars: 50
    require_price_retest: false # Compatibility alias; must match entry.mode.
    close_through_threshold: 0.0
    require_opposing_fvg: true
  risk:
    sl_mode: "exact"
    sl_buffer_pts: 1.0
    risk_frac_range: [0.0, 0.01]
    rr_range: [1.5, 5.0]
  tp:
    mode: "agent"
    allowed_targets:
      - "rr"
      - "buyside_liquidity"
      - "sellside_liquidity"
      - "previous_day_high_low"
    invalid_target_policy: "rr_fallback"
  entry:
    mode: "confirmed_first_eligible"
    enforce_gate: true
  reward:
    entry_bonus: 0.01
    manipulation_penalty: 0.02
    invalid_ifvg_penalty: 0.01
    distribution_bonus: 0.005
    sweep_penalty: 0.02
    strategy_weight: 0.01

env:
  # Action space configuration
  continuous_actions: false  # Set to true for continuous action space Box(-1, 1)
  max_risk_frac: 0.01  # Maximum risk fraction per trade (1% = 0.01)

  # Observation window
  obs_window: 60  # Number of bars in observation window

  # Sweep reward configuration (from PLAN 2)
  use_sweep_reward: true
  sweep_alpha: 0.1
  sweep_beta: 0.01
  sweep_hold_bars: 3
  dsr_weight: 0.3
  sweep_weight: 0.7

  # Risk management
  initial_balance: 100000.0
  max_loss_per_trade_usd: 100.0
  daily_loss_limit: 5000.0
  max_drawdown_limit: 0.1  # 10%

  # Position sizing
  risk_frac_range: [0.005, 0.02]  # Min/max risk fraction
  rr_ratio_range: [1.0, 3.0]  # Min/max risk-reward ratio

  # Trading parameters
  swing_buffer_pts: 1.0
  min_lot: 0.01
  max_lot: 100.0
  contract_size: 1.0

  # Entry gate thresholds
  volume_spike_threshold: 1.5  # Volume spike threshold for entry gate
  london_priority: true  # London sweeps take priority over Asian

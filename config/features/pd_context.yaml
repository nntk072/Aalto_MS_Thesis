# Session-conditional PD context pack for thesis full trains.
# Merge over default.yaml (or 2_po3_ifvg.yaml):
#   uv run thesis-train train --config config/features/pd_context.yaml
features:
  include_pd_context: true
  # LTF confluence: M5/M15/H1 structure + BOS flags aligned onto M1.
  structure: {enabled: true, timeframes: ["M3", "M5", "M10", "M15", "M30", "H1", "H4", "D1"]}

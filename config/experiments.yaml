# Ablation experiment matrix (thesis PLAN 6 + PD-context extensions).
# Each variant trains with the given hyperparameters and is scored OOS through
# the shared evaluation pipeline (build_run_report). Override `steps` / `seeds`
# on the CLI for smoke runs.
#
# Feature-flag variants assume the --features-csv was built with matching
# build_features flags (e.g. include_pd_context). Strategy variants merge the
# Idea 1/2 YAML overlays when constructing the env.
#
# Ladder variants (A0-A4) add one architecture layer per row so marginal value
# is directly measurable. `allow_agent_tp_mode` only takes effect when
# `allow_agent_sl_mode` is also on (trading_env.py:2276), so A2+ require A1.
defaults:
  algo: ppo
  arch: gru
  use_vae: 0
  strategy: baseline
  include_pd_context: false
  steps: 100000
  seeds: [42, 43, 44, 45, 46]
  train_end: "2025-12-31"
  test_start: "2026-01-01"

variants:
  # ===== LADDER: additive architecture layers (TCN) =====
  - name: ladder_a0_flat
    reward_mode: dsr   # effective value before the resolver fix; see CHANGES.md
    arch: tcn
    strategy_actions: true

  - name: ladder_a1_sl
    reward_mode: dsr   # effective value before the resolver fix; see CHANGES.md
    arch: tcn
    strategy_actions: true
    allow_agent_sl_mode: true

  - name: ladder_a2_tp
    reward_mode: dsr   # effective value before the resolver fix; see CHANGES.md
    arch: tcn
    strategy_actions: true
    allow_agent_sl_mode: true
    allow_agent_tp_mode: true

  - name: ladder_a3_multi_tp
    reward_mode: dsr   # effective value before the resolver fix; see CHANGES.md
    arch: tcn
    strategy_actions: true
    allow_agent_sl_mode: true
    allow_agent_tp_mode: true
    allow_multi_tp: true

  - name: ladder_a4b_entry_fsm
    reward_mode: dsr   # effective value before the resolver fix; see CHANGES.md
    arch: tcn
    strategy_actions: true
    allow_agent_sl_mode: true
    allow_agent_tp_mode: true
    allow_multi_tp: true
    entry_state_machine: true
    entry_state_observation: true

  - name: ladder_a4a_entry_fsm_hidden
    reward_mode: dsr   # effective value before the resolver fix; see CHANGES.md
    arch: tcn
    strategy_actions: true
    allow_agent_sl_mode: true
    allow_agent_tp_mode: true
    allow_multi_tp: true
    entry_state_machine: true
    entry_state_observation: false

  # ===== LADDER x STRATEGY (A4b under each strategy) =====
  - name: ladder_a4b_po3_ifvg
    reward_mode: pnl   # effective value before the resolver fix; see CHANGES.md
    strategy: po3_ifvg
    include_pd_context: true
    arch: tcn
    strategy_actions: true
    allow_agent_sl_mode: true
    allow_agent_tp_mode: true
    allow_multi_tp: true
    entry_state_machine: true
    entry_state_observation: true

  - name: ladder_a4b_distribution
    reward_mode: pnl   # effective value before the resolver fix; see CHANGES.md
    strategy: distribution
    include_pd_context: true
    arch: tcn
    strategy_actions: true
    allow_agent_sl_mode: true
    allow_agent_tp_mode: true
    allow_multi_tp: true
    entry_state_machine: true
    entry_state_observation: true

  # ===== LADDER x po3_ifvg (full A0-A4.2 ladder) =====
  - name: ladder_a0_flat_po3
    reward_mode: pnl   # effective value before the resolver fix; see CHANGES.md
    strategy: po3_ifvg
    include_pd_context: true
    arch: tcn
    strategy_actions: true

  - name: ladder_a1_sl_po3
    reward_mode: pnl   # effective value before the resolver fix; see CHANGES.md
    strategy: po3_ifvg
    include_pd_context: true
    arch: tcn
    strategy_actions: true
    allow_agent_sl_mode: true

  - name: ladder_a2_tp_po3
    reward_mode: pnl   # effective value before the resolver fix; see CHANGES.md
    strategy: po3_ifvg
    include_pd_context: true
    arch: tcn
    strategy_actions: true
    allow_agent_sl_mode: true
    allow_agent_tp_mode: true

  - name: ladder_a3_multi_tp_po3
    reward_mode: pnl   # effective value before the resolver fix; see CHANGES.md
    strategy: po3_ifvg
    include_pd_context: true
    arch: tcn
    strategy_actions: true
    allow_agent_sl_mode: true
    allow_agent_tp_mode: true
    allow_multi_tp: true

  - name: ladder_a4a_entry_fsm_hidden_po3
    reward_mode: pnl   # effective value before the resolver fix; see CHANGES.md
    strategy: po3_ifvg
    include_pd_context: true
    arch: tcn
    strategy_actions: true
    allow_agent_sl_mode: true
    allow_agent_tp_mode: true
    allow_multi_tp: true
    entry_state_machine: true
    entry_state_observation: false

  # ===== LADDER x distribution (full A0-A4.2 ladder) =====
  - name: ladder_a0_flat_dist
    reward_mode: pnl   # effective value before the resolver fix; see CHANGES.md
    strategy: distribution
    include_pd_context: true
    arch: tcn
    strategy_actions: true

  - name: ladder_a1_sl_dist
    reward_mode: pnl   # effective value before the resolver fix; see CHANGES.md
    strategy: distribution
    include_pd_context: true
    arch: tcn
    strategy_actions: true

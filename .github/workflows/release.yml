name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write  # For GHCR

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync deps
        run: uv sync --extra dev
      - name: Full test suite
        run: uv run pytest tests/ -v
      - name: Lint & typecheck
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .

  docker-build-push:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /var/lib/docker
          key: docker-${{ runner.os }}-${{ hashFiles('docker-compose.yml', 'Dockerfile') }}
          restore-keys: docker-${{ runner.os }}-
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: dev
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:dev-latest
            ghcr.io/${{ github.repository }}:dev-${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push test image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: test
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:test-latest
            ghcr.io/${{ github.repository }}:test-${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: PyPI publish (out of scope per decision)
  # pypi-publish:
  #   needs: validate
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: astral-sh/setup-uv@v5
  #     - run: uv build
  #     - uses: pypa/gh-action-pypi-publish@release/v1
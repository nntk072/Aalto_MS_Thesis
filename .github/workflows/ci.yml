name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # ============================================================
  # Phase 1: Environment — verify tools, deps, and images
  # ============================================================
  build-dev-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create dummy zscaler.crt for CI (not needed in CI, but Dockerfile expects it)
        run: touch zscaler.crt

      - name: Build dev image
        run: docker compose build dev

  check-docker-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Docker is available
        run: docker info

      - name: Verify docker compose
        run: docker compose version

  check-python-requirements:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify lockfile and pin files are in sync
        run: make deps-check

  check-uv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --extra dev

  check-venv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create .venv and sync
        run: uv sync --extra dev

  # ============================================================
  # Phase 2: Build — formatting, typechecking, packaging
  # ============================================================
  check-docs:
    needs:
      - check-uv
      - check-python-requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Check markdown files
        run: |
          for f in *.md; do
            if [ -f "$f" ]; then
              echo "==> Checking $f"
              wc -l "$f"
            fi
          done

  code-formatting:
    needs:
      - check-uv
      - check-python-requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy quant_rl

  json-check:
    needs: check-uv
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          found=0
          while IFS= read -r -d '' f; do
            echo "==> Validating $f"
            python -m json.tool "$f" > /dev/null
            found=1
          done < <(find . -name '*.json' -not -path './.venv/*' -not -path './.cache/*' -not -path './node_modules/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No JSON files found to validate."
          fi

  markdown-formatting:
    needs: check-uv
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check markdown formatting
        run: |
          for f in *.md; do
            if [ -f "$f" ]; then
              echo "==> Checking $f"
              if command -v mdformat >/dev/null 2>&1; then
                mdformat --check "$f"
              else
                echo "mdformat not available, skipping format check for $f"
              fi
            fi
          done

  docker-release-build:
    needs: build-dev-image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create dummy zscaler.crt for CI
        run: touch zscaler.crt

      - name: Build runtime image
        run: docker compose build base

  uv-build:
    needs:
      - check-uv
      - check-python-requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Build package
        run: uv build

  venv-build:
    needs:
      - check-uv
      - check-python-requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create .venv and install package
        run: |
          uv venv --python 3.12
          uv sync --extra dev
          uv pip install -e .

  # ============================================================
  # Phase 3: Unit Tests
  # ============================================================
  ut-venv:
    needs:
      - code-formatting
      - json-check
      - markdown-formatting
      - uv-build
      - venv-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create .venv and sync
        run: uv sync --extra dev

      - name: Run tests (venv)
        run: uv run pytest tests/ -v

  ut-docker:
    needs:
      - code-formatting
      - docker-release-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create dummy zscaler.crt for CI
        run: touch zscaler.crt

      - name: Run tests in Docker
        run: docker compose run --rm test

  ut-uv:
    needs:
      - code-formatting
      - uv-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests (uv)
        run: uv run pytest tests/ -v

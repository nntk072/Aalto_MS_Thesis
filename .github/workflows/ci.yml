name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  THESIS_CHECK_NO_SYNC: "1"

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: ./tools/check deps

  quality:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check quality

  architecture:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check architecture

  contracts:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check contracts

  unit:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check unit

  build-smoke:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check build

  integration:
    needs: [architecture, contracts, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check integration

  parity:
    needs: [architecture, contracts, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check parity

  training-smoke:
    needs: [integration, parity, build-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check training-smoke

  ci-success:
    if: always()
    needs: [dependency-lock, quality, architecture, contracts, unit, build-smoke, integration, parity, training-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all semantic gates
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = {name: value["result"] for name, value in needs.items() if value["result"] != "success"}
          if failed:
              print(f"Required CI jobs failed or were skipped: {failed}", file=sys.stderr)
              raise SystemExit(1)
          print("All required CI gates passed")
          PY

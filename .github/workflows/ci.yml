name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify lockfile and pin files are in sync
        run: make deps-check

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          . .venv/bin/activate
          python -m pip install --upgrade pip
          # torch first, from an index scoped to the PyTorch CPU index so it
          # cannot shadow PyPI packages. No -c here: constraints.txt pins
          # transitive deps to PyPI-only versions absent from the torch index;
          # those deps are pinned by the constrained PyPI install below.
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0+cpu
          # everything else from PyPI, pinned and constrained.
          pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt
          pip install -c constraints.txt -e . --no-deps

      - name: Run Ruff
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Run mypy
        run: |
          . .venv/bin/activate
          mypy .

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest tests/test_structure.py tests/test_risk.py tests/test_macd_baseline.py -v

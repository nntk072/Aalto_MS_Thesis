# quant_rl default configuration
# All monetary values in account currency (USD).  Prices in points unless noted.

data:
  raw_dir: "data"                      # relative to project root
  cache_dir: "cache"                   # parquet cache
  tz: "Etc/GMT-3"                      # broker server timezone (UTC+3)
  symbols: ["US100.cash", "US500.cash"]
  primary: "US100.cash"
  secondary: "US500.cash"              # used only for SMT divergence
  timeframes: ["M1", "M5", "M15", "M30", "H1", "H4", "D1"]
  split:
    train_end: "2025-12-31"            # inclusive: in-sample ≤ this date
    test_start: "2026-01-01"           # inclusive: out-of-sample ≥ this date
  # True M1 source files (other TF files are known duplicates – see README)
  m1_files:
    US100.cash: "US100.cash_M1_202412300105_202607031959.csv"
    US500.cash: "US500.cash_M1_202412300105_202607031959.csv"
  # Real tick (bid/ask) files for accurate fill pricing
  tick_files:
    US100.cash: "US100.cash_202512290105_202607031959.csv"
    US500.cash: "US500.cash_202412300105_202607031959.csv"

session:
  tz: "Etc/GMT-3"                      # session times below are in this tz
  start: "16:30"                       # NY open proxy
  end:   "23:00"                       # NY close proxy
  # DST caveat: broker tz shift ~1 h around DST transitions; flag only, no fix
  dst_flag: true

account:
  initial_balance: 100000.0
  currency: "USD"
  leverage: 50
  margin_pct: 0.02                     # 2 % margin requirement
  contract_size: 1.0

costs:
  # spread in price units (same unit as bar close prices)
  spread_us100: 0.6
  spread_us500: 1.53
  slippage_points: 0.0
  commission_per_lot: 0.0
  # minimum price increment for converting the CSV integer spread column
  # to price units (e.g. 0.01 for US100 quoted to 2 d.p.)
  point_size: 0.01
  # set false to disable tick lookup and always use bar-spread fallback
  use_tick_execution: true

ftmo:
  daily_loss_limit: 5000.0             # hard kill-switch
  max_loss_limit: 10000.0              # trailing max drawdown kill-switch
  risk_per_trade_limit: 1000.0         # per-trade risk kill-switch
  profit_target: 10000.0               # not enforced in env, only reported

# LIVE/paper execution risk for mt5_trading's RiskManager (used by
# live_trading_rl.py / mt5_trading.robot.rl_robot). These are intentionally a
# percentage-of-balance sizing model, NOT the FTMO dollar kill-switches in
# `ftmo:` above: training/eval enforce ftmo.daily_loss_limit /
# max_loss_limit / risk_per_trade_limit via FTMOGuardrails, while MT5 sizing
# works from balance fractions. Scaling here is chosen so that on the default
# $100k account, risk_per_symbol (1%) ≈ ftmo.risk_per_trade_limit ($1000) —
# keep that ratio aligned if you change account size, and never change one
# without the other. Silent divergence (training under a $1000 cap, live under
# $5000) is the failure mode this block exists to prevent.
live_risk_overrides:
  risk_per_symbol: 0.01          # 1% of balance ≈ $1000 on a $100k account
  max_total_risk: 0.02           # aggregate open-position risk cap (2%)
  default_lot_size: 0.1          # fallback if risk-based sizing fails
  stop_loss_pips: 50.0           # stop distance used by RiskManager sizing
  interval_minutes: 1            # M1 policy cadence for live_trading_rl.py

features:
  window: 60                           # look-back bars fed to encoder
  ema_periods: [9, 13, 21, 50, 200]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  adx_period: 14
  bb_period: 20
  bb_std: 2.0
  stoch_k: 14
  stoch_d: 3
  vwap_session: true                   # calendar-day VWAP on the full-day M1 spine
  return_horizons: [1, 5, 15, 30]
  realized_vol_period: 20
  smt_swing_period: 5                  # bars for swing high/low detection
  smt_corr_window: 20
  zscore_window: 252                   # rolling train-only normalisation window
  # Higher timeframes whose own indicator blocks are causally aligned onto
  # the M1 spine (Chain A). Each listed TF gets the same build_indicators()
  # call as M1, forward-filled with {TF}_{indicator} column names.
  htf_timeframes: ["M5", "M15", "H1"]
  # Chain B/F opt-in feature blocks (all off by default; enabled by the
  # per-variant config files in config/features_*_mtf.yaml).
  include_po3: false            # PO3 time-of-day phase tag (accum/manip/distrib)
  include_fvg_ifvg: false       # per-TF FVG zone features (in-zone flag + ATR dist)
  include_po3_full: false       # full HTF FVG -> LTF IFVG -> entry-trigger pipeline
  include_strategy_state: false # Idea 1: sweeps + PO3 manip/distrib state + IFVG zones
  po3_htf: "M15"                # HTF for the full PO3 pipeline
  po3_ltf: "M5"                 # primary (LTF) for the full PO3 pipeline
  # MTF expansion (mtf_feature_expansion_plan.md §§4-5). Each block is an
  # opt-in nested mapping {enabled, timeframes}: off by default so the base
  # matrix is unchanged; the FVG full-ladder fix (§4.5) rides on the
  # existing include_fvg_ifvg flag with fvg_timeframes defaulting to
  # ["M1"] + htf_timeframes (M1_fvg_* included).
  smt: {enabled: false, timeframes: ["M5", "M15", "H1"]}
  structure: {enabled: false, timeframes: ["M5", "M15", "H1"]}
  liquidity: {enabled: false, timeframes: ["M5", "M15", "H1"]}
  po3_state_mtf: {enabled: false, timeframes: ["M1", "M5", "M15"]}
  ifvg_mtf: {enabled: false, timeframes: ["M1", "M5", "M15"]}
  # CT-anchored session levels (additive to the legacy broker-tz levels in
  # structure.detect_session_levels; new columns carry a _ct suffix).
  # Windows are resolved per bar in `tz` via tz-aware conversion, so US DST
  # transitions are handled by the tz database (features/session_ohlc.py).
  include_session_ohlc: false   # session OHLC + prior-period H/L + quadrants + vwap
  sessions:
    tz: "America/Chicago"       # CT — DST-aware session clock
    asian: {start: "19:00", end: "23:00"}
    london: {start: "02:00", end: "05:00"}
    ny: {start: "08:30", end: "15:00"}
    week_start: "MON"           # ISO weeks are Monday-based; kept explicit
    quadrant_ranges: ["yesterday", "lastweek"]  # ranges that get q_* levels

env:
  obs_window: 60                       # T in [T, F] obs
  n_envs: 8                           # parallel envs for SubprocVecEnv (1 = DummyVecEnv, no parallelism)
  action_type: "discrete"              # "discrete" | "continuous"
  max_episode_steps: 1000
  reward_dsr_eta: 0.01                 # differential Sharpe damping
  strategy_actions: false              # Idea 1/2 4-D Box [dir, risk, rr, tp]
  sl_buffer_pts: 0.0                   # structural stop buffer (0 = exact)
  block_overnight: true                # force-close positions at last NY bar (no gap hold)
  eod_risk:
    max_loss_usd: 500.0
    max_age_hours: 8
    stale_bars: 60
    progress_threshold_atr: 0.25

ppo:
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  total_timesteps: 500000

sac:
  learning_rate: 3.0e-4
  buffer_size: 100000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.01
  learning_starts: 500

agent:
  type: "ppo"                 # "ppo" | "sac"
  arch: "tcn"                 # "tcn" | "gru" | "transformer"
  use_narrative: false        # true to condition on the VAE narrative embedding

device: "auto"

output:
  dir: "outputs"                    # base directory for run artifacts
  save_plots: true                  # save static PNG figures
  save_html: true                   # save interactive plotly HTML
  save_csv: true                    # save equity.csv + trades.csv
  dpi: 150                          # PNG resolution
  candle_tf: "15min"                # resample TF for candlestick chart
  price_plot_max_points: 3000       # max candles in price+orders chart
  trade_chart_show_mae_mfe: true    # show MAE/MFE lines on per-trade charts
  trade_chart_show_sl_tp: true      # show SL/TP lines on per-trade charts

backtest:
  validation:
    max_loss_per_trade_usd: 100.0      # safety cap in USD; structure SL is primary
    take_profit_per_trade_usd: null    # per-trade structure TP replaces global USD TP
    include_costs_in_trade_risk: true
    validation_mode: false             # set true to relax global FTMO limits for viz testing

risk:
  min_lot: 0.01
  max_lot: 100.0
  default_risk_frac: 0.01              # 1% equity fallback for baselines
  min_sl_atr_mult: 0.5                 # reject/tighten stops inside noise
  swing_buffer_pts: 1.0
  rr_ratio_default: 2.0

training:
  mode: "full"           # "full" = all data / "mvp" = M1-only minimal slice
  use_m1_only: false     # true = skip SMT/secondary features (M1 primary only)
  primary_only: false    # true = ignore secondary symbol entirely
  max_days: null         # null = all data; integer = last N calendar days for training
  total_timesteps_mvp: 8192   # short timestep count used in mvp mode

# Chain E Step 0 — auxiliary return-prediction head (opt-in).
auxiliary:
  aux_weight: 0.0        # 0.0 = disabled (control); 0.1 = treatment arm
  prediction_horizon: 5  # bars ahead for the per-bar-return target
  lr: 0.0001             # auxiliary optimizer lr (head + encoder)
  grad_steps: 4          # gradient steps per rollout
# Idea 1 / Idea 2 strategy semantics (Agent.md §10). All keys default to
# the Idea 1 (PO3 + IFVG) values; config/idea2_distribution.yaml overrides.
strategy:
  name: "po3_ifvg"              # "baseline" | "po3_ifvg" | "distribution"
  session:
    timezone: "Etc/GMT-3"
  liquidity:
    swing_period: 5
    require_reclaim: true
    max_age_bars: 120
  po3:
    require_manipulation_sweep: true
    require_distribution_confirmation: true
  ifvg:
    enabled: true
    max_age_bars: 50
    require_price_retest: true
  risk:
    sl_mode: "exact"            # "exact" | "buffered"
    sl_buffer_pts: 1.0
    risk_frac_range: [0.005, 0.02]
    rr_range: [1.0, 3.0]
  tp:
    mode: "agent"
    allowed_targets:
      - "rr"
      - "buyside_liquidity"
      - "sellside_liquidity"
      - "previous_day_high_low"
    invalid_target_policy: "rr_fallback"
  entry:
    enforce_gate: false         # false = diagnostic; true = hard gate
  reward:
    entry_bonus: 0.01
    manipulation_penalty: 0.02
    invalid_ifvg_penalty: 0.01
    distribution_bonus: 0.005
    strategy_weight: 0.1
  batch_windows: 256     # supervised windows sampled per rollout
